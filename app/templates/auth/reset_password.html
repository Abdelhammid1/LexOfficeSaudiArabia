{% extends "base_auth.html" %}
{% block title %}إعادة تعيين كلمة المرور{% endblock %}

{% block content %}
<h4 class="text-center mb-4">إعادة تعيين كلمة المرور</h4>
<form method="POST" action="{{ url_for('auth.reset_password', user_id=user_id) }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="mb-3">
        <label for="otp" class="form-label">رمز التحقق</label>
        <input type="text" class="form-control text-center" id="otp" name="otp" maxlength="6" required dir="ltr">
    </div>
    <div class="mb-3">
        <label for="new_password" class="form-label">كلمة المرور الجديدة</label>
        <div class="input-group password-group">
            <input type="password" class="form-control" id="new_password" name="new_password" required dir="ltr">
            <button class="btn btn-outline-secondary password-toggle" type="button"
                    data-target="new_password" aria-label="إظهار/إخفاء كلمة المرور">
                <i class="bi bi-eye"></i>
            </button>
        </div>
    </div>
    <div class="mb-3">
        <label for="confirm_password" class="form-label">تأكيد كلمة المرور</label>
        <div class="input-group password-group">
            <input type="password" class="form-control" id="confirm_password" name="confirm_password" required dir="ltr">
            <button class="btn btn-outline-secondary password-toggle" type="button"
                    data-target="confirm_password" aria-label="إظهار/إخفاء كلمة المرور">
                <i class="bi bi-eye"></i>
            </button>
        </div>
    </div>
    <button type="submit" class="btn btn-primary w-100">تغيير كلمة المرور</button>
</form>
{% endblock %}
