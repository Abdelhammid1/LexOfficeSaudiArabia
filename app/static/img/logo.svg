<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 96" role="img" aria-label="المُستشار">
  <defs>
    <linearGradient id="navy" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#142E63"/>
      <stop offset="1" stop-color="#0C2461"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3FB1E8"/>
      <stop offset="1" stop-color="#1E8FCB"/>
    </linearGradient>
  </defs>

  <!-- Two-square emblem (navy left, cyan right in RTL reading order) -->
  <g transform="translate(208,8)">
    <rect x="0"  y="0" width="44" height="80" rx="3" fill="url(#navy)"/>
    <rect x="46" y="0" width="44" height="80" rx="3" fill="url(#cyan)"/>

    <!-- Scales of justice centered across both squares -->
    <g fill="#FFFFFF" stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round">
      <!-- Vertical post -->
      <rect x="44" y="20" width="2" height="48" rx="1"/>
      <!-- Base -->
      <rect x="38" y="66" width="14" height="3" rx="1"/>
      <rect x="34" y="69" width="22" height="2" rx="1"/>
      <!-- Top knob -->
      <circle cx="45" cy="20" r="2.6"/>
      <!-- Crossbar -->
      <rect x="20" y="24" width="50" height="2" rx="1"/>
      <!-- Cord lines down to pans -->
      <line x1="26" y1="25" x2="26" y2="38" stroke-width="1.4" fill="none"/>
      <line x1="64" y1="25" x2="64" y2="38" stroke-width="1.4" fill="none"/>
      <!-- Left pan -->
      <path d="M16 38 Q26 52 36 38 Z"/>
      <!-- Right pan -->
      <path d="M54 38 Q64 52 74 38 Z"/>
    </g>
  </g>

  <!-- Arabic wordmark: المُستشار -->
  <text x="196" y="62"
        font-family="'Tajawal','Cairo','Noto Naskh Arabic',sans-serif"
        font-size="44" font-weight="800"
        fill="#0C2461" text-anchor="end" direction="rtl">المُستشار</text>
</svg>
